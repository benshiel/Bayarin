
<section class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-slate-900">Spending Overview</h2>
            <button class="text-xs text-slate-500 font-medium flex items-center gap-1 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100">
              This Month
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
          </div>

          <div class="flex items-center gap-4">
            <!-- Donut Chart Canvas SVG -->
            <div class="relative w-36 h-36 flex-shrink-0 flex items-center justify-center">
              <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                <!-- Housing 40% -->
                <circle cx="18" cy="18" r="14" fill="transparent" stroke="#7C3AED" stroke-width="4.5" stroke-dasharray="35.18 52.77" stroke-dashoffset="0" />
                <!-- Utilities 20% -->
                <circle cx="18" cy="18" r="14" fill="transparent" stroke="#3B82F6" stroke-width="4.5" stroke-dasharray="17.59 70.36" stroke-dashoffset="-35.18" />
                <!-- Transportation 15% -->
                <circle cx="18" cy="18" r="14" fill="transparent" stroke="#F97316" stroke-width="4.5" stroke-dasharray="13.19 74.76" stroke-dashoffset="-52.77" />
                <!-- Subscriptions 15% -->
                <circle cx="18" cy="18" r="14" fill="transparent" stroke="#10B981" stroke-width="4.5" stroke-dasharray="13.19 74.76" stroke-dashoffset="-65.96" />
                <!-- Others 10% -->
                <circle cx="18" cy="18" r="14" fill="transparent" stroke="#CBD5E1" stroke-width="4.5" stroke-dasharray="8.79 79.16" stroke-dashoffset="-79.15" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="text-[13px] font-bold text-slate-900">₱ 24,850</span>
                <span class="text-[10px] text-slate-400">Total</span>
              </div>
            </div>

            <!-- Categories Legend -->
            <div class="flex-1 space-y-2">
              @for (cat of categories; track cat.label) {
                <div class="flex items-center justify-between text-xs">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full" [style.background-color]="cat.color"></span>
                    <span class="text-slate-600 font-medium">{{ cat.label }}</span>
                  </div>
                  <span class="font-bold text-slate-800">₱ {{ cat.amount | number }}</span>
                </div>
              }
            </div>
          </div>
</section>
