        <section class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-bold text-slate-900">Recent Bills</h2>
            <a href="#" class="text-xs font-semibold text-violet-600 hover:text-violet-700">View All</a>
          </div>

          <div class="divide-y divide-slate-50">
            @for (bill of recentBills; track bill.id) {
              <div class="py-2 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div [class]="'w-10 h-10 rounded-xl flex items-center justify-center ' + bill.iconBg + ' ' + bill.iconColor">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                  </div>
                  <div>
                    <p class="text-sm font-bold text-slate-800 leading-tight">{{ bill.title }}</p>
                    <p class="text-[11px] text-slate-400 mt-0.5">{{ bill.date }}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4">
                  <p class="text-sm font-bold text-slate-900">₱ {{ bill.amount | number:'1.2-2' }}</p>
                  <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">
                    {{ bill.status }}
                  </span>
                </div>
              </div>
            }
          </div>
</section>
